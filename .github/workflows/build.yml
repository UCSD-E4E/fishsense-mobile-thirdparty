name: Build

on:
  push:
    tags:
      - "v*.*"

jobs:
  build-onnx:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Build ONNX Runtime XCFramework
      run: |
        CMAKE_POLICY_VERSION_MINIMUM=3.5 python3 ./onnxruntime/tools/ci_build/github/apple/build_and_assemble_apple_pods.py \
          --staging-dir ./onnxruntime/build \
          --build-settings-file ./onnxruntime_ios_build_settings.json
        pushd ./onnxruntime/build/onnxruntime-c/onnxruntime.xcframework
        zip -r ../../../../onnxruntime.xcframework.zip *
        popd
        pushd ./onnxruntime
        zip -r ../onnxruntime-build.zip build
        popd
    - name: Upload ONNX Runtime XCFramework
      uses: actions/upload-artifact@v4
      with:
        name: onnxruntime.xcframework
        path: onnxruntime.xcframework.zip
    - name: Upload ONNX Runtime Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onnxruntime-build
        path: onnxruntime-build.zip

  release:
    needs: [build-onnx]
    runs-on: ubuntu-latest

    steps:
    - name: Download ONNX Runtime XCFramework
      uses: actions/download-artifact@v4
      with:
        name: onnxruntime.xcframework
    - name: Download ONNX Runtime Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: onnxruntime-build
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          onnxruntime.xcframework.zip
          onnxruntime-build.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
