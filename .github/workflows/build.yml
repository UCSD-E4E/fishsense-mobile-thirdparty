name: Build

on:
  push:
    tags:
      - "v*.*"

jobs:
  build-opencv:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Build OpenCV XCFramework
      # OpenCV's CPU_BASELINE=DETECT enables the NEON_FP16 code paths but its iOS
      # Xcode toolchain never emits the matching -march=...+fp16 flag. AppleClang
      # (Xcode 26+) hard-errors on the resulting target-feature mismatch in
      # modules/dnn. Supply the flag, scoped to the arm64 slices via -Xarch_arm64
      # so the x86_64 simulator build ignores it. Harmless on older toolchains.
      env:
        CFLAGS: "-Xarch_arm64 -march=armv8.2-a+fp16"
        CXXFLAGS: "-Xarch_arm64 -march=armv8.2-a+fp16"
      run: |
        python3 ./opencv/platforms/apple/build_xcframework.py \
          --out ./opencv/build \
          --iphoneos_deployment_target 17.0 \
          --iphoneos_archs arm64 \
          --iphonesimulator_archs arm64 \
          --build_only_specified_archs True \
          --dynamic \
          --without objc
        cd ./opencv/build/opencv2.xcframework && zip -r ../../../opencv2.xcframework.zip *
    - name: Upload OpenCV XCFramework
      uses: actions/upload-artifact@v4
      with:
        name: opencv2.xcframework
        path: opencv2.xcframework.zip

  build-onnx:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Build ONNX Runtime XCFramework
      run: |
        CMAKE_POLICY_VERSION_MINIMUM=3.5 python3 ./onnxruntime/tools/ci_build/github/apple/build_and_assemble_apple_pods.py \
          --staging-dir ./onnxruntime/build \
          --build-settings-file ./onnxruntime_ios_build_settings.json
        pushd ./onnxruntime/build/onnxruntime-c/onnxruntime.xcframework
        zip -r ../../../../onnxruntime.xcframework.zip *
        popd
        pushd ./onnxruntime
        zip -r ../onnxruntime-build.zip build
        popd
    - name: Upload ONNX Runtime XCFramework
      uses: actions/upload-artifact@v4
      with:
        name: onnxruntime.xcframework
        path: onnxruntime.xcframework.zip
    - name: Upload ONNX Runtime Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onnxruntime-build
        path: onnxruntime-build.zip

  release:
    needs: [build-opencv, build-onnx]
    runs-on: ubuntu-latest

    steps:
    - name: Download OpenCV XCFramework
      uses: actions/download-artifact@v4
      with:
        name: opencv2.xcframework
    - name: Download ONNX Runtime XCFramework
      uses: actions/download-artifact@v4
      with:
        name: onnxruntime.xcframework
    - name: Download ONNX Runtime Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: onnxruntime-build
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          opencv2.xcframework.zip
          onnxruntime.xcframework.zip
          onnxruntime-build.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
